name: CI

on:
  push:
    branches: [ main, 'feat/*', 'chore/*', 'test/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: |
          pytest -q

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.7.10'
      - name: Terraform init (infra/terraform)
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate (infra/terraform)
        working-directory: infra/terraform
        run: terraform validate
