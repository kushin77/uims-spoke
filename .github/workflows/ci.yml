name: CI

on:
  push:
    branches: [ main, feat/*, chore/*, test/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: |
          pytest -q

  # Terraform checks (placeholder) - configure GCP credentials in secrets before enabling
  terraform:
    runs-on: ubuntu-latest
    if: false # enable after configuring credentials
    steps:
      - uses: actions/checkout@v4
      - name: Terraform fmt
        run: terraform fmt -check -recursive || true
name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt || true
      - name: Lint
        run: make lint || true
      - name: Test
        run: make test || true
